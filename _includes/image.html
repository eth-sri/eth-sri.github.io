{%- assign image_path = include.src | prepend: '/' | replace: '//', '/' -%}
{%- assign thumbnail = site.data.thumbnails[image_path] -%}
<img src="{{ thumbnail.src | default: include.src | relative_url }}"
  {%- if thumbnail %}
  srcset="{% for variant in thumbnail.variants %}{{ variant.url | relative_url }} {{ variant.width }}w{% unless forloop.last %}, {% endunless %}{% endfor %}"
  sizes="{{ include.sizes | default: '100vw' }}"
  width="{{ thumbnail.width }}" height="{{ thumbnail.height }}"
  {%- endif %}
  alt="{{ include.alt | default: '' | escape }}"
  loading="{{ include.loading | default: 'lazy' }}" decoding="async"
  class="responsive-image{% if include.class %} {{ include.class | escape }}{% endif %}"
  {%- if include.id %} id="{{ include.id | escape }}"{% endif %}
  {%- if include.usemap %} usemap="{{ include.usemap | escape }}"{% endif %}>
