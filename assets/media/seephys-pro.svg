<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" role="img" aria-labelledby="title desc">
  <title id="title">SeePhys Pro</title>
  <desc id="desc">The SeePhys Pro icon.</desc>
  <defs>
    <filter id="crayon" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="paper" x1="7" x2="89" y1="6" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE7A9"/>
      <stop offset="0.55" stop-color="#DFF2FF"/>
      <stop offset="1" stop-color="#E4F5DC"/>
    </linearGradient>
  </defs>
  <rect x="5" y="5" width="86" height="54" rx="16" fill="url(#paper)"/>
  <rect x="5" y="5" width="86" height="54" rx="16" fill="none" stroke="#B8C4D4" stroke-opacity="0.55"/>
  <g filter="url(#crayon)" fill="none" stroke-linecap="round">
    <path d="M13 42 C20 34, 27 29, 35 24" stroke="#C64E45" stroke-width="5" stroke-opacity="0.82"/>
    <path d="M13 46 C21 38, 28 34, 36 30" stroke="#2F8F69" stroke-width="4" stroke-opacity="0.72"/>
    <path d="M16 49 C24 43, 30 39, 36 36" stroke="#3E86BD" stroke-width="3" stroke-opacity="0.68"/>
  </g>
  <text x="25" y="34" text-anchor="middle" font-family="Kalam, 'Segoe Print', 'Comic Sans MS', cursive" font-size="23" font-weight="700" fill="#1F2937" opacity="0.88" filter="url(#crayon)">S</text>
  <text x="62" y="29" text-anchor="middle" font-family="Kalam, 'Segoe Print', 'Comic Sans MS', cursive" font-size="11" font-weight="700" fill="#1F2937">SeePhys</text>
  <text x="62" y="42" text-anchor="middle" font-family="Kalam, 'Segoe Print', 'Comic Sans MS', cursive" font-size="10" font-weight="700" fill="#1F2937">Pro</text>
</svg>
